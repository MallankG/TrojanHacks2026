      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

      width: 100%;

      position: absolute;
      top: 0;
      left: 0;

    }

      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 14, 18, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.18);

      border-radius: 999px;

      font-weight: 500;

      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }

      border-radius: 3px;
      width: 0%;
      transition: width 0.1s linear;

      align-items: center;

l money-flow graph highlighting detected layering chains in bold red.", "narration_file": "narration/scene-04.txt", "narration": "Our in-memory graph engine traces time-respecting money paths and cycles. Across two hundred eighty thousand transactions, it recovered fifty-nine of sixty injected layering chains in just seven milliseconds, illuminating the full laundering route in vivid red."}, {"id": "scene-05-copilot", "number": 5, "title": "Multi-Agent Copilot with 9-Rule Verifier", "file": "scenes/scene-05-copilot.html", "duration_s": 9, "focus": "Local LLM narrative synthesis verified by nine mathematical invariant checks.", "narration_file": "narration/scene-05.txt", "narration": "Investigations run on bounded LangGraph multi-agent workflows. A local air-gapped language model writes the narrative synthesis, which is immediately checked by a nine-rule deterministic verifier validating every dollar amount, account ID, and timestamp against ground truth."}, {"id": "scene-06-decision", "number": 6, "title": "Four-Eyes Review & Cryptographic Audit", "file": "scenes/scene-06-decision.html", "duration_s": 8, "focus": "Mandatory human supervisory sign-off and append-only database audit receipts.", "narration_file": "narration/scene-06.txt", "narration": "AI assists, but human compliance officers always make the final call. Every supervisory sign-off produces an Ed25519 hash-chained cryptographic receipt stored in an append-only audit log that mathematically refuses updates or deletions."}, {"id": "scene-07-conclusion", "number": 7, "title": "See the Whole Path. Trust Every Number.", "file": "scenes/scene-07-conclusion.html", "duration_s": 6, "focus": "TraceLayer: The governed financial-crime intelligence layer.", "narration_file": "narration/scene-07.txt", "narration": "TraceLayer connects financial-crime signals to the governed evidence behind them. See the whole path, trust every number, and empower human compliance."}]};

    let currentIdx = 0;
    let isPlaying = false;
    let audio = new Audio();
    let sceneTimer = null;
    let progressTimer = null;
    let elapsedInScene = 0;

    function resizeIframe() {
      const vp = document.getElementById("viewport");
      const iframe = document.getElementById("scene-frame");
      const scale = vp.clientWidth / 1920;
      iframe.style.transform = `scale(${scale})`;
    }

    window.addEventListener("resize", resizeIframe);
    window.addEventListener("DOMContentLoaded", () => {
      resizeIframe();
      loadScene(0);
    });

    function loadScene(idx) {
      currentIdx = idx;
      const sc = manifest.scenes[idx];
      document.getElementById("scene-frame").src = sc.file;
      document.getElementById("caption").innerText = sc.narration;
      document.getElementById("scene-counter").innerText = `SCENE ${idx + 1} / ${manifest.scenes.length}`;
      document.getElementById("scene-title").innerText = sc.title;
      
      if (audioData[sc.id]) {
        audio.src = audioData[sc.id];
      }

      elapsedInScene = 0;
      updateTotalProgress();

      if (isPlaying) {
        audio.play().catch(e => console.log(e));
        startSceneTimer();
      }
    }

    function startSceneTimer() {
      if (sceneTimer) clearTimeout(sceneTimer);
      const sc = manifest.scenes[currentIdx];
      const durationMs = (sc.duration_s || 8) * 1000;

      sceneTimer = setTimeout(() => {
        if (currentIdx < manifest.scenes.length - 1) {
          nextScene();
        } else {
          pause();
          loadScene(0);
        }
      }, durationMs);
    }

    function togglePlay() {
      if (isPlaying) {
        pause();
      } else {
        play();
      }
    }

    function play() {
      isPlaying = true;
      document.getElementById("play-btn").innerText = "⏸ Pause";
      if (audioData[manifest.scenes[currentIdx].id]) {
        audio.play().catch(e => console.log(e));
      }
      startSceneTimer();
      startProgressTimer();
    }

    function pause() {
      isPlaying = false;
      document.getElementById("play-btn").innerText = "▶ Play";
      audio.pause();
      if (sceneTimer) clearTimeout(sceneTimer);
      if (progressTimer) clearInterval(progressTimer);
    }

    function nextScene() {
      if (currentIdx < manifest.scenes.length - 1) {
        loadScene(currentIdx + 1);
      }
    }

    function prevScene() {
      if (currentIdx > 0) {
        loadScene(currentIdx - 1);
      }
    }

    function startProgressTimer() {
      if (progressTimer) clearInterval(progressTimer);
      progressTimer = setInterval(() => {
        elapsedInScene += 0.2;
        updateTotalProgress();
      }, 200);
    }

    function updateTotalProgress() {
      const totalSeconds = manifest.scenes.reduce((acc, s) => acc + s.duration_s, 0);
      let elapsedTotal = 0;
      for (let i = 0; i < currentIdx; i++) {
        elapsedTotal += manifest.scenes[i].duration_s;
      }
      elapsedTotal += Math.min(elapsedInScene, manifest.scenes[currentIdx].duration_s);
      const pct = Math.min(100, (elapsedTotal / totalSeconds) * 100);
      document.getElementById("progress-fill").style.width = `${pct}%`;
      document.getElementById("timer").innerText = `${fmt(elapsedTotal)} / ${fmt(totalSeconds)}`;
    }

    function fmt(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
    }
  </script>
