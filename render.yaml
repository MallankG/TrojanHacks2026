# Render Blueprint: the FastAPI backend on the free plan (512 MB RAM).
# Free can't hold torch + xgboost, so it installs requirements-slim.txt: the trained IBM models report
# "unavailable" while rules, anomaly, graph, agents and Groq run. For the full models use the
# Hugging Face Space in deploy/huggingface/ instead (DEPLOY.md).
services:
  - type: web
    name: tracelayer-api
    runtime: python
    plan: free
    # repo root, so the build can see agents/ beside backend/ (-e ../agents)
    buildCommand: cd backend && pip install -r requirements-slim.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: ENVIRONMENT
        value: production
      # Groq receives case evidence for narrative drafting, so it is a declared destination
      - key: APPROVED_DATA_DESTINATIONS
        value: '["local","supabase","groq"]'
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SERVICE_API_KEY
        generateValue: true
      # JSON list, e.g. ["https://tracelayer.vercel.app"]
      - key: CORS_ORIGINS
        sync: false
